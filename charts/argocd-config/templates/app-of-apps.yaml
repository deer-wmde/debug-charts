apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  project: {{ .Values.environment }}
  sources:
    - repoURL: {{ .Values.repoUrls.debugCharts }}
      targetRevision: aee38d7921ceb45104c3fe1d5bace76d4dbc08d1
      path: charts/argocd-apps
      helm:
        values: |
{{ toYaml .Values | indent 10 }}
        valueFiles:
          - $deployRepo/k8s/argocd/{{ .Values.environment }}/app-of-apps.values.yaml
    - repoURL: {{ .Values.repoUrls.debugDeploy }}
      targetRevision: 601e74de8aa72b3e1b8a33bef0bf579bd8e773b8
      ref: deployRepo
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
