apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  project: {{ .Values.environment }}
  sources:
    - repoURL: {{ .Values.repoUrls.debugCharts }}
      targetRevision: 3ea1c7ba120435496421ebfd64903f05df13b8a2
      chart: argocd-apps
      helm:
        values: |
{{ toYaml .Values | indent 10 }}
        valueFiles:
          - $deployRepo/k8s/argocd/{{ .Values.environment }}/app-of-apps.values.yaml
    - repoURL: {{ .Values.repoUrls.debugDeploy }}
      targetRevision: b0a699b8079c0496a616cce6117ee1204add455f
      ref: deployRepo
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
