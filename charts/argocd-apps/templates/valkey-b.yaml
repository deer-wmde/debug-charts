apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: valkey-a
  namespace: argocd
spec:
  destination:
    namespace: default
    server: {{ .Values.clusterUrl }}
  project: {{ .Values.environment }}
  sources:
    - repoURL: https://github.com/deer-wmde/debug-charts.git
      targetRevision: 10cf427611c9639a929f55c833d9593e905f0afa
      path: charts/valkey
      helm:
        valueFiles:
          - $deployRepo/k8s/argocd/production/valkey-b.values.yaml
          - $deployRepo/k8s/argocd/{{ .Values.environment }}/valkey-b.values.yaml
    - repoURL: {{ .Values.repoUrls.debugDeploy }}
      targetRevision: 81d689b0884bcc1546b82bf50ab71377a6721cf4
      ref: deployRepo
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
