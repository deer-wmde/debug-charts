apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: valkey-a
  namespace: argocd
spec:
  destination:
    namespace: default
    server: {{ .Values.clusterUrl }}
  project: {{ .Values.environment }}
  sources:
    - repoURL: https://github.com/deer-wmde/debug-charts.git
      targetRevision: 3ea1c7ba120435496421ebfd64903f05df13b8a2
      path: charts/argocd-apps
      helm:
        valueFiles:
          - $deployRepo/k8s/argocd/{{ .Values.environment }}/valkey-a.values.yaml
    - repoURL: {{ .Values.repoUrls.debugDeploy }}
      targetRevision: HEAD
      ref: deployRepo
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
