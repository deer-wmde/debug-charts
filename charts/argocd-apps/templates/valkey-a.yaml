apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: valkey-a
  namespace: argocd
spec:
  destination:
    namespace: default
    server: {{ .Values.clusterUrl }}
  project: {{ .Values.environment }}
  sources:
    - repoURL: https://github.com/deer-wmde/debug-charts.git
      targetRevision: 10cf427611c9639a929f55c833d9593e905f0afa
      path: charts/argocd-apps
      helm:
        valueFiles:
          - $deployRepo/k8s/argocd/{{ .Values.environment }}/valkey-a.values.yaml
    - repoURL: {{ .Values.repoUrls.debugDeploy }}
      targetRevision: b0a699b8079c0496a616cce6117ee1204add455f
      ref: deployRepo
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
